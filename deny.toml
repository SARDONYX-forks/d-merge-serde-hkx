# cargo-deny config: Only non-default settings.
# - All settings: https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[advisories]
ignore = [
  # rustybuzz and ttf-parser are only used through svg_to_ico for build-time
  # SVG to ICO generation. They are not included in the final binary/runtime
  # dependency tree. Waiting for resvg/usvg to migrate to maintained crates.
  "RUSTSEC-2026-0206",
  "RUSTSEC-2026-0192",
]

[licenses]
allow = ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "MIT", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "allow"
deny = [
  "rhexdump", # This is GPL
]

[sources.allow-org]
# - `havok_classes_hk2014`: hk2014(Fallout4) classes
# - `d-merge-serde-hkx`: Used by `havok_classes_hk2014`(patched to path)
github = ["SARDONYX-forks"]
