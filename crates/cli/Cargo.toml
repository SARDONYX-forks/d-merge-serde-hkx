[package]
name              = "hkxc"
description       = "Havok Behavior (De)Serialization CLI(for ver. hk_2010.2.0-r1)"
version.workspace = true
categories        = ["development-tools"]

authors.workspace      = true
edition.workspace      = true
keywords.workspace     = true
license.workspace      = true
readme.workspace       = true
repository.workspace   = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap                  = { workspace = true } # For CLI
clap_complete_command = { workspace = true } # Generate auto completion
anstream              = { workspace = true } # Strip ANSI color automatically when not terminal(same as clap)
indicatif             = { workspace = true, features = ["rayon"] } # CLI progress bar
tokio                 = { workspace = true, features = ["macros", "rt", "time", "rt-multi-thread"] }
tracing               = { workspace = true }
tracing-subscriber    = { workspace = true }

# workspace members
serde_hkx_features = { workspace = true, features = ["clap", "tracing", "serde_default"] }

[build-dependencies]
ico       = { workspace = true }
resvg     = { workspace = true }
tiny-skia = { workspace = true }
usvg      = { workspace = true }
winres    = { workspace = true } # Meta information can be added to the exe.


[features]
default = ["color", "hk2010", "extra_fmt"]

# Havok classes version.(Exclusive) e.g. Fallout4: `--no-default-features --features color,hk2014,extra_fmt`
hk2010 = ["serde_hkx_features/hk2010"]
hk2014 = ["serde_hkx_features/hk2014"]

# ANSI color
color = []

# Extra output format(json)
extra_fmt = ["serde_hkx_features/extra_fmt"]

[lints]
workspace = true
