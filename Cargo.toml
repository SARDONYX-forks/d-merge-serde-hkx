[workspace.package]
authors      = ["SARDONYX"]
categories   = ["encoding"]
description  = "Havok Behavior (De)Serialization Library(ver. hk_2010.2.0-r1) + Nemesis ID"
edition      = "2024"
keywords     = ["serde", "havok"]
license      = "MIT OR Apache-2.0"
readme       = "README.md"
repository   = "https://github.com/SARDONYX-sard/serde-hkx" # NOTE: Without it, CLI & CI build will error.
rust-version = "1.89"
version      = "1.0.1"

[workspace]
members         = ["crates/*", "serde_hkx"]
default-members = ["crates/cli"]
resolver        = "3"

[workspace.dependencies]
bitflags    = "2.13.2" # To generate flags type
clap        = { version = "4.6.8", features = ["derive"] } # For CLI
educe       = "0.8.2"
indexmap    = "2.14.2"
jwalk       = { version = "0.9.0" }
lexical     = { version = "7.0.5", features = ["radix", "format", "power-of-two"] }
num-derive  = "0.5.1"
num-traits  = "0.2.19"
proc-macro2 = { version = "1.0.107", default-features = false }
quote       = { version = "1.0.47", default-features = false }
rayon       = { version = "1.12.0" }
schemars    = { version = "1.2.3" }
serde       = { version = "1.0.229", features = ["derive"] }
serde_json  = { version = "1.0.154" }
serde_with  = { version = "3.24.0", default-features = false, features = ["alloc", "macros"] } # Set the default feature to false to exclude chrono, which has stopped maintenance.
similar     = "3.2.1" # Create diff
snafu       = "0.9.2" # Define all error patterns(with backtrace)
syn         = { version = "3.0.10", default-features = false }
tokio       = { version = "1.54.1" }
tracing     = { version = "0.1.44" } # logger
winnow      = { version = "1.0.5", features = ["simd"] }

# auto_charset
chardetng   = "1.0.0"
encoding_rs = "0.8.44"

# class_generator
derive-new   = "0.7.0"
prettyplease = "0.3.0"

# cli
anstream              = "1.0.0" # Strip ANSI color automatically when not terminal(same as clap)
clap_complete_command = "0.6.1" # Generate auto completion
indicatif             = "0.18.6" # CLI progress bar
tracing-subscriber    = "0.3.23"

# cli(build-dependencies)
ico       = "0.6.0"
resvg     = "0.50.0"
tiny-skia = "0.12.0"
usvg      = "0.50.0"
winres    = "0.1.12" # Meta information can be added to the exe.

# diff
imara-diff = "0.2.0"

# havok_serde
arrayvec = "0.7.8" # To lazy init fixed array

# serde_hkx
byteorder   = "1.5.0" # Care Endianness
html-escape = "0.3.0" # Use XML escaping

# serde_hkx_features
sonic-rs = "0.5.11"

# winnow_ext
annotate-snippets = "0.12.18" # Error reporting display

# dev-dependencies
pretty_assertions = "1.4.1" # Color diff assertion
quick_tracing     = { version = "0.1.5", features = ["derive"] } # Easy logging
zerocopy          = "0.8.55" # To(As)Bytes

# workspace members
auto_charset       = { path = "./crates/auto_charset" }
class_generator    = { path = "./crates/class_generator" }
diff               = { path = "./crates/diff" }
havok_classes      = { path = "./crates/havok_classes" }
havok_serde        = { path = "./crates/havok_serde" }
havok_types        = { path = "./crates/havok_types" }
havok_types_derive = { path = "./crates/havok_types_derive" }
serde_hkx          = { path = "./serde_hkx", default-features = false }
serde_hkx_features = { path = "./crates/serde_hkx_features", default-features = false } # Select `hk2010` or `hk2014` in each crate.
winnow_ext         = { path = "./crates/winnow_ext" }

# external(generated by `class_generator`)
havok_classes_hk2014 = { git = "https://github.com/SARDONYX-forks/havok_classes_hk2014", rev = "8b1f2b8" } # Fallout4

# `havok_classes_hk2014` depends on the crates of this repository by git url.
# Use the path ones of this workspace instead. Otherwise traits are different types.
[patch."https://github.com/SARDONYX-forks/d-merge-serde-hkx"]
havok_serde        = { path = "./crates/havok_serde" }
havok_types        = { path = "./crates/havok_types" }
havok_types_derive = { path = "./crates/havok_types_derive" }


# Use release mode during development to prevent `serde-hkx` stack overflow
# - ref: https://doc.rust-lang.org/cargo/reference/profiles.html#release
[profile.release-lto]
codegen-units = 1
inherits      = "release"
lto           = true
panic         = "abort"
strip         = true

[workspace.lints.clippy]
all     = { level = "warn", priority = -1 }
cargo   = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# allow list
allow_attributes_without_reason = "allow"
cargo_common_metadata           = "allow"
derive_partial_eq_without_eq    = "allow"
future_not_send                 = "allow"
multiple_crate_versions         = "allow"
pub_with_shorthand              = "allow"
redundant_pub_crate             = "allow"

# custom deny list
char_lit_as_u8                     = "deny"
checked_conversions                = "deny"
clone_on_ref_ptr                   = "deny"
cognitive_complexity               = "deny"
debug_assert_with_mut_call         = "deny"
disallowed_script_idents           = "deny"
doc_link_with_quotes               = "deny"
empty_enums                        = "deny"
empty_line_after_outer_attr        = "deny"
empty_structs_with_brackets        = "deny"
expect_used                        = "deny"
expl_impl_clone_on_copy            = "deny"
explicit_deref_methods             = "deny"
explicit_into_iter_loop            = "deny"
fallible_impl_from                 = "deny"
filetype_is_file                   = "deny"
filter_map_next                    = "deny"
flat_map_option                    = "deny"
float_cmp                          = "deny"
float_cmp_const                    = "deny"
float_equality_without_abs         = "deny"
fn_params_excessive_bools          = "deny"
fn_to_numeric_cast_any             = "deny"
if_let_mutex                       = "deny"
implicit_clone                     = "deny"
imprecise_flops                    = "deny"
inefficient_to_string              = "deny"
invalid_upcast_comparisons         = "deny"
items_after_test_module            = "deny"
large_digit_groups                 = "deny"
large_stack_arrays                 = "deny"
large_types_passed_by_value        = "deny"
let_unit_value                     = "deny"
linkedlist                         = "deny"
lossy_float_literal                = "deny"
macro_use_imports                  = "deny"
manual_ok_or                       = "deny"
map_flatten                        = "deny"
map_unwrap_or                      = "deny"
match_same_arms                    = "deny"
match_wild_err_arm                 = "deny"
match_wildcard_for_single_variants = "deny"
mem_forget                         = "deny"
missing_const_for_fn               = "deny"
missing_enforced_import_renames    = "deny"
missing_errors_doc                 = "deny"
missing_panics_doc                 = "deny"
mut_mut                            = "deny"
mutex_integer                      = "deny"
needless_borrow                    = "deny"
needless_continue                  = "deny"
needless_for_each                  = "deny"
option_if_let_else                 = "deny"
option_option                      = "deny"
panic                              = "deny" # Use with test and code_gen
path_buf_push_overwrite            = "deny"
ptr_as_ptr                         = "deny"
rc_mutex                           = "deny"
ref_option_ref                     = "deny"
rest_pat_in_fully_bound_structs    = "deny"
same_functions_in_if_condition     = "deny"
semicolon_if_nothing_returned      = "deny"
single_match_else                  = "deny"
string_add                         = "deny"
string_add_assign                  = "deny"
string_lit_as_bytes                = "deny"
suspicious_operation_groupings     = "deny"
trait_duplication_in_bounds        = "deny"
unnested_or_patterns               = "deny"
unseparated_literal_suffix         = "deny"
unused_self                        = "deny"
unwrap_in_result                   = "deny"
unwrap_used                        = "deny"
useless_let_if_seq                 = "deny"
useless_transmute                  = "deny"
verbose_file_reads                 = "deny"
wildcard_dependencies              = "deny"
zero_sized_map_values              = "deny"
